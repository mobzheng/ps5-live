name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      MEDIAMTX_VERSION: '1.11.3'
      MEDIAMTX_SHA256: 'f9c690556fbe0eb8d409aea5c1ae48af16d985a80db12a58c2793e15e0f3c4de'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 下载 mediamtx 并校验 sha256
        shell: pwsh
        run: |
          $ver = $env:MEDIAMTX_VERSION
          $file = "mediamtx_v${ver}_windows_amd64.zip"
          $url = "https://github.com/bluenviron/mediamtx/releases/download/v${ver}/$file"
          Invoke-WebRequest -Uri $url -OutFile $file
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:MEDIAMTX_SHA256) { throw "mediamtx 校验失败：$hash" }
          Expand-Archive $file -DestinationPath mtx
          New-Item -ItemType Directory -Force assets | Out-Null
          Copy-Item mtx\mediamtx.exe assets\mediamtx.exe

      - name: 安装构建依赖
        run: npm ci --prefix tools

      - name: 构建后台引擎（Node SEA）
        run: node tools/build-engine.mjs

      - name: 构建桌面客户端（内嵌引擎 + WebView2）
        run: node tools/build-client.mjs

      - name: 生成校验值
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'engine.exe' } | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Out-File -Encoding utf8 dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PS5Live-windows-x64
          path: |
            dist/PS5直播助手.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PS5直播助手.exe
            dist/SHA256SUMS.txt
          body: |
            下载 `PS5直播助手.exe` 双击即可。
            第一次使用点窗口里的「完成设置」，在弹出的系统窗口点“是”（只弹一次）。
